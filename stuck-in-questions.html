<style>
/* =========================================================
   LEXICAL TRAIL · skin: FRONT PAGE (cream newsprint, ink
   outlines, highlighter yellow, editor red, teal accents)
   ========================================================= */
:root{
  --bg:#F7F1E3; --bg2:#EFE7D2; --card:#FFFFFF; --ink:#221F1A; --mute:#6E6759; --line:#2B2526;
  --soft:#FBF7EC; --red:#C0392B; --red-d:#96281B; --yellow:#FFE95C; --teal:#0E7C7B;
  --gray:#ECE7DA; --ok:#2F8A3A; --ok-soft:#E3F4DE; --bad:#C23B2E; --bad-soft:#FBE4E1;
  --hl:#FFF0A3;
  --display:'Playfair Display',Georgia,'Times New Roman',serif;
  --body:'Nunito Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
  --hand:'Patrick Hand','Comic Sans MS','Segoe Print',cursive;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 var(--body);overflow-x:hidden}
button{font-family:inherit}
[hidden]{display:none!important}
.wrap{max-width:900px;margin:0 auto;padding:10px 14px 60px;position:relative;z-index:1}

/* drifting decorative badges */
.drift{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.drift span{position:absolute;width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:var(--red);color:#fff;
  border:2.5px solid var(--line);font:20px/1 var(--hand);border-radius:52% 48% 50% 50%/48% 52% 49% 51%;opacity:.18;animation:float 15s ease-in-out infinite alternate}
.drift span.alt{background:var(--yellow);color:var(--ink)}
@keyframes float{to{transform:translate(16px,-28px) rotate(13deg)}}

/* header */
.hero{position:relative;text-align:left;padding:24px 4px 10px}
.hero h1{font:700 clamp(34px,8vw,58px)/1 var(--display);margin:0;letter-spacing:-.01em}
.hero h1 span{display:block}
.hero h1 span:nth-child(2){padding-left:.6em}
.hero h1 span:nth-child(3){padding-left:1.2em}
.hero .sub{display:inline-block;margin:14px 0 0;background:var(--yellow);border:2px solid var(--line);border-radius:999px;padding:7px 18px;font:400 18px/1.2 var(--hand)}
.hero .by{margin:10px 0 0;color:var(--mute);font-size:14.5px;max-width:520px}
.total{position:absolute;right:6px;top:20px;display:flex;flex-direction:column;align-items:center;gap:4px}
.total .tb{width:74px;height:74px;font-size:30px}
.total small{font:15px var(--hand);color:var(--red-d);text-align:center;max-width:110px;line-height:1.1}
.badge{display:inline-flex;align-items:center;justify-content:center;background:var(--red);color:#fff;border:2.5px solid var(--line);
  font:700 15px/1 var(--body);border-radius:50%;min-width:34px;height:34px;padding:0 4px;box-shadow:2px 2px 0 var(--line)}
.tb{width:34px;height:34px}

/* stage rail */
.navrail{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 78%,transparent);padding:8px 0 14px}
#nav{display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;padding:18px 2px 8px;scrollbar-width:thin}
#nav button{position:relative;flex:0 0 auto;border:2px solid var(--line);background:var(--card);border-radius:999px;
  padding:8px 14px;font:700 14.5px/1 var(--body);cursor:pointer;box-shadow:2px 2px 0 var(--line)}
#nav button.on{background:var(--ink);color:#fff}
#nav button.done{background:var(--ok-soft)}
#nav button .tb{position:absolute;top:-15px;right:-11px;width:30px;height:30px;font-size:12.5px;line-height:26px;min-width:30px;border-width:2px;padding:0;box-shadow:1.5px 1.5px 0 var(--line)}
#nav button.on .tb{box-shadow:1.5px 1.5px 0 rgba(0,0,0,.4)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:2px solid var(--line);padding-top:10px}
.navfoot{display:flex;justify-content:space-between;gap:10px;margin-top:18px}

/* generic bits */
.btn{border:2px solid var(--line);background:var(--yellow);border-radius:12px;padding:12px 20px;font:800 16px/1 var(--body);
  cursor:pointer;box-shadow:3px 3px 0 var(--line);transition:transform .12s,box-shadow .12s}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--line)}
.btn.ghost{background:var(--card)}
.btn.sm{padding:9px 14px;font-size:14px;border-radius:10px;box-shadow:2px 2px 0 var(--line)}
.btn.teal{background:var(--teal);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:16px;margin:12px 0;box-shadow:4px 4px 0 rgba(43,37,38,.16)}
.mute{color:var(--mute)}
.small{font-size:13.5px}
.hand{font-family:var(--hand)}
.fb{margin-top:10px;font-size:15px}
.fb.show{padding:10px 12px;border-radius:10px;background:var(--soft);border:1.5px dashed var(--mute)}
.okc{color:var(--ok);font-weight:800}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.prog{height:10px;background:var(--gray);border:2px solid var(--line);border-radius:99px;overflow:hidden;margin:4px 0 6px}
.prog i{display:block;height:100%;width:0;background:repeating-linear-gradient(-45deg,var(--yellow) 0 8px,var(--teal) 8px 16px);transition:width .35s}
.prog.green i{background:repeating-linear-gradient(-45deg,var(--ok-soft) 0 8px,var(--ok) 8px 16px)}
.chip{display:inline-block;border:2px solid var(--line);border-radius:999px;padding:6px 13px;background:var(--card);
  font:700 14.5px/1.2 var(--body);cursor:pointer;box-shadow:2px 2px 0 var(--line);transition:transform .12s}
.chip:active{transform:translate(1px,1px)}
.chip.sel{background:var(--yellow);transform:translate(2px,2px);box-shadow:0 0 0 var(--line)}
.chip.off{opacity:.4;text-decoration:line-through;pointer-events:none}
.chip.dash{border-style:dashed;background:var(--soft)}
input[type=text],textarea{width:100%;border:2px solid var(--line);border-radius:12px;padding:11px 13px;font:16px/1.4 var(--body);background:#fff}
textarea{min-height:110px;resize:vertical}
input:focus,textarea:focus,button:focus-visible{outline:3px solid var(--teal);outline-offset:1px}
mark{background:var(--hl);border-radius:4px;padding:0 3px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.pop{animation:pop .3s}
@keyframes pop{40%{transform:scale(1.06)}}
.stage{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
.shead{display:flex;gap:14px;align-items:flex-start;margin:10px 0 4px}
.shead h2{font:700 clamp(24px,5vw,32px)/1.1 var(--display);margin:0}
.shead p{margin:5px 0 0;color:var(--mute);font-size:15px;max-width:560px}
.rain{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.rain i{position:absolute;top:-30px;font-style:normal;animation:fall linear both}
@keyframes fall{to{transform:translateY(112vh) rotate(340deg)}}
.toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:12px;
  padding:11px 16px;font:600 14px/1.35 var(--body);z-index:60;box-shadow:4px 4px 0 rgba(0,0,0,.25);max-width:92vw}
.toast button{background:var(--yellow);color:var(--ink);border:2px solid #fff;border-radius:8px;padding:4px 10px;font:800 13px var(--body);margin-left:10px;cursor:pointer}
.stamp{display:inline-block;font:700 13px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--red);
  border:2.5px solid var(--red);border-radius:8px;padding:3px 9px;transform:rotate(-3deg)}

/* stage-specific */
.fcard{position:relative;display:block;width:100%;min-height:150px;border:2px solid var(--line);border-radius:16px;background:var(--card);
  box-shadow:4px 4px 0 rgba(43,37,38,.16);cursor:pointer;perspective:600px;text-align:left;padding:0;transform-style:preserve-3d;transition:transform .35s}
.fcard .face{display:flex;flex-direction:column;gap:6px;padding:14px 16px;backface-visibility:hidden}
.fcard .front .c{font:700 20px/1.15 var(--display)}
.fcard .front .p{font:700 11px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--teal)}
.fcard .front .hint{margin-top:auto;font:14px var(--hand);color:var(--mute)}
.fcard .back{position:absolute;inset:0;background:var(--hl);border-radius:14px;transform:rotateY(180deg)}
.fcard .back .m{font-size:14.5px;line-height:1.4}
.fcard .back .ru{color:var(--red-d);font-weight:800;font-size:14px}
.fcard .back .col{font-size:14px}
.fcard .back .nt{font:14px var(--hand);color:var(--mute)}
.fcard.flip{transform:rotateY(180deg)}
#art span.t{cursor:pointer;padding:0 1px;border-radius:3px}
#art span.t.f{background:linear-gradient(180deg,transparent 8%,var(--hl) 8%,var(--hl) 92%,transparent 92%);border-bottom-color:transparent}
.ru{direction:ltr}
.detail{min-height:64px}
@media (max-width:480px){
  .shead p{font-size:14px}
  .hero h1{font-size:clamp(30px,10vw,40px)}
}
</style>
</head>

        <button type="button" class="btn sm" data-chk ${st==='ok'?'disabled':''}>Check</button></div>
        <div class="fb" data-fb></div></div>`);
    const card=tr.querySelector(`[data-tk="${tk}"]`),inp=card.querySelector('[data-in]'),fb=card.querySelector('[data-fb]');
    const showSol=()=>{fb.className='fb show';
      fb.innerHTML=`<div><b>${esc(t.en)}</b></div><div class="mute small" style="margin-top:4px">⚠ ${esc(t.note)}</div>`};
    if(st==='ok')showSol();
    card.querySelector('[data-chk]').onclick=()=>{
      const v=inp.value;S.tr.val[tk]=v;
      if(new RegExp(t.re,'i').test(norm(v))){
        S.tr.state[tk]='ok';card.style.background='var(--ok-soft)';inp.disabled=true;card.querySelector('[data-chk]').disabled=true;
        SFX.play('right');save();drawBadges();showSol();
        if(Object.values(S.tr.state).filter(x=>x==='ok').length===DATA.translate.length)celebrate('s6');
      }else{
        card.classList.remove('shake');void card.offsetWidth;card.classList.add('shake');SFX.play('wrong');S.tr.state[tk]='miss';save();
        showSol();
      }
    };
  });
  const upd=()=>{const p=$('#pg');if(!p)return;const done=Object.values(S.tr.state).filter(x=>x==='ok').length;p.style.width=(done/DATA.translate.length*100)+'%'};
  upd();const _d=drawBadges;drawBadges=function(){_d();upd()};
};

/* ---------- STAGE 6 · Use it ---------- */
R[6]=()=>{
  main.innerHTML=`<section class="stage">`+head(7,'Now say something real','Pick a question. Answer it out loud for 90 seconds, aiming for the phrases below. Then write it: every target phrase lights up as you use it.')+
  `<div id="prompts" class="row" style="gap:8px;margin:6px 0"></div>
   <div id="body"></div></section>`;
  const pb=$('#prompts');
  DATA.use.forEach((u,uk)=>{
    const done=S.use.done.includes(uk);
    pb.insertAdjacentHTML('beforeend',`<button type="button" class="chip${S.use.cur===uk?' sel':''}${done?'':''}" data-p="${uk}">${uk+1}. ${done?'✓ ':''}${esc(u.q.slice(0,52))}…</button>`);
  });
  pb.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{S.use.cur=+b.dataset.p;save();R[6]()});
  const u=DATA.use[S.use.cur];
  const words=norm(S.use.txt[S.use.cur]||'').split(' ').filter(Boolean).length;
  $('#body').innerHTML=`
   <div class="card">
     <div style="font-size:17px;font-weight:700">${esc(u.q)}</div>
     <div class="row" style="margin-top:10px;gap:6px">${u.chunks.map(([lab])=>`<span class="chip" data-chip="${esc(lab)}" style="pointer-events:none">${esc(lab)}</span>`).join('')}</div>
     <div class="row" style="margin-top:12px"><button type="button" class="btn teal sm" id="tmr">⏱ 90 seconds, talk</button><span class="hand" id="tt" style="font-size:19px;color:var(--red-d)"></span></div>
     <textarea id="w" placeholder="Now write your answer here — aim for 40+ words and light up all four phrases." aria-label="your answer">${esc(S.use.txt[S.use.cur]||'')}</textarea>
     <div class="row" style="margin-top:6px"><span class="mute small" id="wc">${words} words</span><span class="mute small" id="lit"></span></div>
     <div class="model" id="mo" hidden></div>
   </div>`;
  const ta=$('#w');
  const light=()=>{
    const t=ta.value;S.use.txt[S.use.cur]=t;save();
    const n=norm(t).split(' ').filter(Boolean).length;$('#wc').textContent=n+' words';
    const used=u.chunks.map(([lab,re])=>[lab,new RegExp(re,'i').test(norm(t))]);
    document.querySelectorAll('[data-chip]').forEach(c=>{const on=used.find(([lab])=>lab===c.dataset.chip)[1];c.classList.toggle('sel',on)});
    $('#lit').textContent=used.filter(x=>x[1]).length+' / '+u.chunks.length+' phrases lit';
    if(n>=40){
      if(!S.use.done.includes(S.use.cur)){S.use.done.push(S.use.cur);SFX.play('right');drawBadges()}
      $('#mo').hidden=false;
    }
  };
  ta.addEventListener('input',light);
  if(words>=40){$('#mo').hidden=false;$('#mo').innerHTML=`<div class="fb show"><div class="hand" style="font-size:20px">One way to say it</div><div style="margin-top:4px">${esc(u.model)}</div><p style="margin:8px 0 0"><button type="button" class="btn sm ghost" id="spk">🔊 Read it aloud</button></p></div>`;
    $('#spk').onclick=()=>{try{const u2=new SpeechSynthesisUtterance(u.model);u2.lang='en-US';const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.startsWith('en-US'));if(v)u2.voice=v;SFX.hush(true);speechSynthesis.cancel();speechSynthesis.speak(u2);u2.onend=()=>SFX.hush(false)}catch(e){}};}
  $('#tmr').onclick=()=>{
    clearInterval(window._tm);let s=90;SFX.play('stage');
    window._tm=setInterval(()=>{s--;$('#tt').textContent=s>0?s+'s':'Time! Which phrases came out easily?';
      if(s<=10&&s>0&&s%2===0)SFX.play('tick');
      if(s<=0){clearInterval(window._tm);SFX.play('stage')}},1000);
  };
  light();
};

/* ---------- STAGE 7 · Lock it in ---------- */
R[7]=()=>{
  if(S.lock.round*10>=S.lock.order.length)S.lock.round=0;
  main.innerHTML=`<section class="stage">`+head(8,'Lock it in','Best done a day or two after the other stages, without looking back. Read the clue, type the phrase. Retrieval after a gap is what makes vocabulary stick.')+
  `<div class="prog"><i id="pg"></i></div><div id="lk"></div>
   <div class="row" style="margin-top:12px"><button type="button" class="btn" id="rck">Check all</button><button type="button" class="btn ghost" id="rnew">New round</button></div><div class="fb" id="rres"></div></section>`;
  const lk=$('#lk');
  curLock().forEach(({k,j})=>{
    const l=DATA.lock[k],st=S.lock.state['r'+S.lock.round+'_'+k];
    lk.insertAdjacentHTML('beforeend',
     `<div class="card" data-k="${k}" style="margin:8px 0;padding:12px 14px;${st==='ok'?'background:var(--ok-soft)':''}">
        <div style="font-size:15.5px;margin-bottom:6px">${esc(l.clue)}</div>
        <div class="row"><input type="text" data-in value="${esc(S.lock.val[k]||'')}" placeholder="type the phrase" ${st==='ok'?'disabled':''} aria-label="answer">
        <button type="button" class="btn sm" data-chk ${st==='ok'?'disabled':''}>Check</button></div></div>`);
    const card=lk.querySelector(`[data-k="${k}"]`),inp=card.querySelector('[data-in]');
    const ok=v=>new RegExp(l.re,'i').test(norm(v));
    if(st==='ok'){card.insertAdjacentHTML('beforeend',`<div class="fb"><span class="okc">✓ ${esc(l.model)}</span></div>`)}
    card.querySelector('[data-chk]').onclick=()=>{
      const v=inp.value;S.lock.val[k]=v;
      if(ok(v)){S.lock.state['r'+S.lock.round+'_'+k]='ok';inp.disabled=true;card.querySelector('[data-chk]').disabled=true;
        card.style.background='var(--ok-soft)';card.insertAdjacentHTML('beforeend',`<div class="fb"><span class="okc">✓ ${esc(l.model)}</span></div>`);
        SFX.play('right');save();drawBadges();
      }else{
        card.classList.remove('shake');void card.offsetWidth;card.classList.add('shake');SFX.play('wrong');save();
        card.insertAdjacentHTML('beforeend',`<div class="fb" data-miss><span style="color:var(--bad);font-weight:800">Not it.</span> <span class="mute small">Model: <b>${esc(l.model)}</b></span></div>`);
        setTimeout(()=>{const m=card.querySelector('[data-miss]');if(m)m.remove()},FAST?200:2600);
      }
    };
  });
  const upd=()=>{const p=$('#pg');if(!p)return;const done=curLock().filter(l=>S.lock.state['r'+S.lock.round+'_'+l.k]==='ok').length;p.style.width=(done/curLock().length*100)+'%'};
  upd();const _d=drawBadges;drawBadges=function(){_d();upd()};
  $('#rck').onclick=()=>{lk.querySelectorAll('[data-chk]:not([disabled])').forEach(b=>b.click());
    const allOk=curLock().every(l=>S.lock.state['r'+S.lock.round+'_'+l.k]==='ok');
    $('#rres').className='fb show';
    $('#rres').innerHTML=allOk?`<span class="okc">Round clear.</span> <span class="mute">New round for the rest, or come back tomorrow.</span>`:`<span style="color:var(--bad);font-weight:800">Some lines are still open.</span> <span class="mute">They stay — check them above.</span>`;
    if(allOk)celebrate('s7');
  };
  $('#rnew').onclick=()=>{S.lock.round=(S.lock.round+1)%Math.ceil(S.lock.order.length/10);S.lock.order=shuffle(DATA.lock.map((_,k)=>k));save();R[7]()};
};

/* ---------- boot ---------- */
if(loadState()){
  const t=$('#toast');t.hidden=false;
  t.innerHTML=`Welcome back. Your progress is saved. <button type="button" id="wipe">Start over</button>`;
  let armed=false;
  $('#wipe').onclick=()=>{if(!armed){armed=true;$('#wipe').textContent='Tap again to clear everything';setTimeout(()=>{armed=false;$('#wipe').textContent='Start over'},4000);return}
    wipeState();location.reload()};
}
go(Math.min(S.stage||0,7));

</script>
</body>
</html>
